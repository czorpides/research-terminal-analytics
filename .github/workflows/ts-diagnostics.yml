name: TypeScript diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.head_ref == 'agent/institutional-opportunity-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply contained type fix
        shell: python
        run: |
          from pathlib import Path

          model = Path('src/lib/opportunity/institutional-model.ts')
          text = model.read_text()
          if 'safeDsri' not in text:
              anchor = '  const score =\n    -4.84 +'
              insert = (
                  '  const [safeDsri, safeGmi, safeAqi, safeSgi, safeDepi, safeSgai, safeLvgi, safeTata] =\n'
                  '    values as number[];\n'
                  '  const score =\n'
                  '    -4.84 +'
              )
              if anchor not in text:
                  raise SystemExit('Expected Beneish score anchor not found')
              text = text.replace(anchor, insert, 1)
              replacements = {
                  '0.92 * dsri': '0.92 * safeDsri',
                  '0.528 * gmi': '0.528 * safeGmi',
                  '0.404 * aqi': '0.404 * safeAqi',
                  '0.892 * sgi': '0.892 * safeSgi',
                  '0.115 * depi': '0.115 * safeDepi',
                  '0.172 * sgai': '0.172 * safeSgai',
                  '4.679 * tata': '4.679 * safeTata',
                  '0.327 * lvgi': '0.327 * safeLvgi',
              }
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Expected Beneish token not found: {old}')
                  text = text.replace(old, new, 1)
              model.write_text(text)

          ui = Path('src/components/research/OpportunityRadarInstitutionalView.tsx')
          ui_text = ui.read_text().replace('  TrendingUp,\n', '')
          ui.write_text(ui_text)

          one_shot = Path('.github/workflows/apply-institutional-type-fix.yml')
          if one_shot.exists():
              one_shot.unlink()
      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/opportunity/institutional-model.ts src/components/research/OpportunityRadarInstitutionalView.tsx .github/workflows/apply-institutional-type-fix.yml
          git commit -m "Fix institutional TypeScript narrowing"
          git push origin HEAD:${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture TypeScript output
        id: tsc
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc-errors.txt
      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc-errors.txt
          if-no-files-found: error
      - name: Fail when TypeScript failed
        if: steps.tsc.outcome == 'failure'
        run: exit 1
