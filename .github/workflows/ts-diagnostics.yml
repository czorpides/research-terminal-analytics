name: TypeScript diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture TypeScript output
        id: tsc
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc-errors.txt
      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc-errors.txt
          if-no-files-found: error
      - name: Fail when TypeScript failed
        if: steps.tsc.outcome == 'failure'
        run: exit 1
