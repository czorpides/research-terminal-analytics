name: Apply institutional type fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/institutional-opportunity-engine'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Narrow validated Beneish inputs
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lib/opportunity/institutional-model.ts')
          text = path.read_text()
          old = '''  const score =
    -4.84 +
    0.92 * dsri +
    0.528 * gmi +
    0.404 * aqi +
    0.892 * sgi +
    0.115 * depi -
    0.172 * sgai +
    4.679 * tata -
    0.327 * lvgi;'''
          new = '''  const [safeDsri, safeGmi, safeAqi, safeSgi, safeDepi, safeSgai, safeLvgi, safeTata] =
    values as number[];
  const score =
    -4.84 +
    0.92 * safeDsri +
    0.528 * safeGmi +
    0.404 * safeAqi +
    0.892 * safeSgi +
    0.115 * safeDepi -
    0.172 * safeSgai +
    4.679 * safeTata -
    0.327 * safeLvgi;'''
          if old not in text:
              raise SystemExit('Expected Beneish score block not found')
          path.write_text(text.replace(old, new))

          ui = Path('src/components/research/OpportunityRadarInstitutionalView.tsx')
          ui_text = ui.read_text().replace('  TrendingUp,\n', '')
          ui.write_text(ui_text)
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/apply-institutional-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/opportunity/institutional-model.ts src/components/research/OpportunityRadarInstitutionalView.tsx
          git commit -m "Fix institutional TypeScript narrowing"
          git push origin HEAD:${{ github.head_ref }}
