          insert_at = ui.index('\nfunction CandidateTable(')
          components = r'''
function ResearchShortlist({
  candidates,
  horizon,
}: {
  candidates: OpportunityCandidate[];
  horizon: InvestmentHorizon;
}) {
  const ranked = [...candidates]
    .filter((candidate) =>
      ["high_conviction", "qualified", "watch"].includes(
        candidate.funnel[horizon].researchTier,
      ),
    )
    .sort((left, right) => {
      const leftFunnel = left.funnel[horizon];
      const rightFunnel = right.funnel[horizon];
      return (
        researchTierRank(rightFunnel.researchTier) -
          researchTierRank(leftFunnel.researchTier) ||
        rightFunnel.convictionScore - leftFunnel.convictionScore
      );
    })
    .slice(0, 8);

  return (
    <DashboardPanel
      eyebrow="Analyst queue"
      title="Companies with enough basis to investigate"
      description="Ranked by independent evidence agreement. High conviction means start with the filing and valuation; qualified means a first-pass thesis is justified; watch means wait for one more proof point."
      equalHeight={false}
      actions={
        <Badge variant="outline" className="font-mono text-[9px]">
          {ranked.length} prioritised
        </Badge>
      }
    >
      {ranked.length === 0 ? (
        <div className="rounded border border-dashed border-border p-6 text-center text-xs text-muted-foreground">
          No company currently has enough independent evidence for the practical research queue.
          Check fundamental coverage and the explicit next-proof items rather than treating this as
          evidence that no opportunity exists.
        </div>
      ) : (
        <div className="grid gap-2 md:grid-cols-2 xl:grid-cols-4">
          {ranked.map((candidate, index) => {
            const funnel = candidate.funnel[horizon];
            return (
              <article
                key={candidate.assetId}
                className="rounded-md border border-border/65 bg-background/25 p-3"
              >
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <div className="font-mono text-[9px] text-muted-foreground">#{index + 1}</div>
                    <div className="text-sm font-semibold">{candidate.symbol}</div>
                    <div className="line-clamp-1 text-[9px] text-muted-foreground">
                      {candidate.name}
                    </div>
                  </div>
                  <ResearchTierBadge tier={funnel.researchTier} />
                </div>
                <div className="mt-3 flex items-end justify-between gap-2">
                  <div>
                    <div className="font-mono text-2xl font-semibold tabular-nums">
                      {funnel.convictionScore.toFixed(0)}
                    </div>
                    <div className="text-[9px] text-muted-foreground">research conviction</div>
                  </div>
                  <div className="text-right text-[9px] text-muted-foreground">
                    {funnel.independentSignals} independent signals
                  </div>
                </div>
                <div className="mt-2 min-h-10 text-[10px] leading-relaxed text-muted-foreground">
                  {funnel.strengths[0] ?? funnel.detail}
                </div>
                <div className="mt-2 border-t border-border/45 pt-2 text-[9px] leading-relaxed text-muted-foreground">
                  <span className="font-semibold text-foreground">Next proof: </span>
                  {funnel.nextProof[0] ?? "Review the latest filing and guidance."}
                </div>
                <div className="mt-2 flex items-center justify-between gap-2">
                  <DiscoveryRouteBadges routes={funnel.routes} />
                  <CandidateDialog candidate={candidate} horizon={horizon} />
                </div>
              </article>
            );
          })}
        </div>
      )}
    </DashboardPanel>
  );
}

function ResearchTierBadge({ tier }: { tier: ResearchTier }) {
  return (
    <Badge
      variant="outline"
      className={cn(
        "whitespace-nowrap px-1.5 py-0 text-[8px]",
        tier === "high_conviction"
          ? "border-[var(--positive)]/55 bg-[var(--positive)]/10 text-[var(--positive)]"
          : tier === "qualified"
            ? "border-[var(--info)]/55 bg-[var(--info)]/10 text-[var(--info)]"
            : tier === "watch"
              ? "border-[var(--warning)]/55 text-[var(--warning)]"
              : tier === "avoid"
                ? "border-[var(--negative)]/55 text-[var(--negative)]"
                : "border-border text-muted-foreground",
      )}
    >
      {researchTierLabel(tier).toUpperCase()}
    </Badge>
  );
}

function ResearchConvictionPanel({
  candidate,
  horizon,
}: {
  candidate: OpportunityCandidate;
  horizon: InvestmentHorizon;
}) {
  const funnel = candidate.funnel[horizon];
  const columns = [
    { title: "Why it qualifies", items: funnel.strengths, positive: true },
    { title: "What could break it", items: funnel.concerns, positive: false },
    { title: "Evidence required next", items: funnel.nextProof, positive: false },
  ];
  return (
    <DashboardPanel
      title={`${researchTierLabel(funnel.researchTier)} · ${funnel.convictionScore.toFixed(1)}/100`}
      description={`${funnel.independentSignals} independent signals. This score determines analyst priority; it does not claim the investment is already proven.`}
      expandable={false}
    >
      <div className="grid gap-3 lg:grid-cols-3">
        {columns.map((column) => (
          <div key={column.title} className="rounded border border-border/55 bg-muted/15 p-2.5">
            <div className="mb-2 flex items-center gap-1.5 text-[9px] font-semibold uppercase tracking-wider text-muted-foreground">
              <Target className="h-3.5 w-3.5" /> {column.title}
            </div>
            {column.items.length ? (
              <ul className="space-y-1.5 text-[10px] leading-relaxed">
                {column.items.map((item) => (
                  <li key={item} className="flex gap-1.5">
                    <span className={column.positive ? "text-[var(--positive)]" : "text-[var(--warning)]"}>›</span>
                    <span>{item}</span>
                  </li>
                ))}
              </ul>
            ) : (
              <div className="text-[10px] text-muted-foreground">No item recorded.</div>
            )}
          </div>
        ))}
      </div>
    </DashboardPanel>
  );
}
