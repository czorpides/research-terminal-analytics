          gate_replacement = '''function coverageGates(candidates: OpportunityCandidate[]): CoverageGate[] {
  const counts = new Map<string, number>();
  for (const candidate of candidates) {
    counts.set(candidate.countryCode, (counts.get(candidate.countryCode) ?? 0) + 1);
  }
  const euCodes = new Set([
    "AT", "BE", "BG", "HR", "CY", "CZ", "DE", "DK", "EE", "ES", "FI", "FR", "GR",
    "HU", "IE", "IT", "LT", "LU", "LV", "MT", "NL", "PL", "PT", "RO", "SE", "SI", "SK",
  ]);
  const euCount = [...counts.entries()].reduce(
    (sum, [code, count]) => sum + (euCodes.has(code) ? count : 0),
    0,
  );
  return [
    {
      market: "United States",
      code: "US",
      state: "shadow",
      trackedAssets: counts.get("US") ?? 0,
      available: "Prices, current fundamentals, Piotroski, Magic Formula and reported EPS",
      missing: "Point-in-time estimates, ownership and full factor controls",
      activationRule:
        "Research tiers are live; production eligibility still requires a clean point-in-time backtest.",
    },
    {
      market: "United Kingdom",
      code: "UK",
      state: "shadow",
      trackedAssets: counts.get("GB") ?? counts.get("UK") ?? 0,
      available: "Global prices and current fundamental scoring where provider identifiers resolve",
      missing: "Validated UK macro exposures, filing coverage and corporate-action audit",
      activationRule: "Use research-conviction tiers in shadow mode and monitor provider failures.",
    },
    {
      market: "Developed Europe",
      code: "EU",
      state: "shadow",
      trackedAssets: euCount,
      available: "Global prices and current fundamental scoring where provider identifiers resolve",
      missing: "Country-specific macro exposures, filing coverage and corporate-action audit",
      activationRule: "Use research-conviction tiers in shadow mode and activate production country by country.",
    },
    {
      market: "Other developed markets",
      code: "DEV",
      state: "disabled",
      trackedAssets: 0,
      available: "Model specification only",
      missing: "All production equity evidence",
      activationRule:
        "Start only after US, UK and Europe operate within provider and storage budgets.",
    },
    {
      market: "Emerging markets",
      code: "EM",
      state: "disabled",
      trackedAssets: 0,
      available: "Model specification only",
      missing: "Reliable identifiers, filings, estimates, FX and delisted-company history",
      activationRule: "Remain disabled until local-market point-in-time quality is proven.",
    },
  ];
}
'''
          text = text[:gate_start] + gate_replacement + text[gate_end:]
          workspace_path.write_text(text)

          ui_path = Path('src/components/research/OpportunityRadarView.tsx')
          ui = ui_path.read_text()
          ui = require_replace(
              ui,
              '  ShieldCheck,\n} from "lucide-react";',
              '  ShieldCheck,\n  Target,\n} from "lucide-react";',
              'target icon import',
          )
          ui = require_replace(
              ui,
              'import type { RegimeMonitorPayload } from "@/lib/panels/regime.functions";\n',
              'import type { RegimeMonitorPayload } from "@/lib/panels/regime.functions";\nimport { researchTierLabel, researchTierRank, type ResearchTier } from "@/lib/opportunity/conviction";\n',
              'research tier import',
          )
          ui = require_replace(
              ui,
              '  const [routeFilter, setRouteFilter] = useState<DiscoveryRoute | "all">("all");\n',
              '  const [routeFilter, setRouteFilter] = useState<DiscoveryRoute | "all">("all");\n  const [tierFilter, setTierFilter] = useState<ResearchTier | "researchable" | "all">("researchable");\n',
              'tier filter state',
          )
          ui = require_replace(
              ui,
              '''        if (stateFilter !== "all" && candidate.horizons[horizon].modelState !== stateFilter) {
          return false;
        }
        return routeFilter === "all" || candidate.funnel[horizon].routes.includes(routeFilter);''',
              '''        if (stateFilter !== "all" && candidate.horizons[horizon].modelState !== stateFilter) {
          return false;
        }
        const tier = candidate.funnel[horizon].researchTier;
