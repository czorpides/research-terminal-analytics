name: Apply Opportunity Radar conviction framework

on:
  push:
    branches:
      - agent/global-universe-and-research-surfaces

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[conviction-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-universe-and-research-surfaces
          fetch-depth: 0
      - name: Patch workspace and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def require_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          workspace_path = Path('src/lib/opportunity/workspace.functions.ts')
          text = workspace_path.read_text()

          text = require_replace(
              text,
              'import type { PiotroskiTest } from "./fundamental-models";\n',
              'import type { PiotroskiTest } from "./fundamental-models";\nimport { assessResearchConviction, type ResearchTier } from "./conviction";\n',
              'conviction import',
          )
          text = require_replace(
              text,
              'export type DiscoveryRoute = "price_dislocation" | "magic_formula" | "improving_value";',
              'export type DiscoveryRoute =\n  | "price_dislocation"\n  | "magic_formula"\n  | "improving_value"\n  | "quality_value";',
              'discovery route type',
          )
          text = require_replace(
              text,
              '''export interface CandidateFunnel {
  routes: DiscoveryRoute[];
  nominated: boolean;
  shadowPriority: number;
  piotroskiValidation: "confirmation" | "neutral" | "warning" | "unavailable";
  detail: string;
}''',
              '''export interface CandidateFunnel {
  routes: DiscoveryRoute[];
  nominated: boolean;
  shadowPriority: number;
  convictionScore: number;
  researchTier: ResearchTier;
  independentSignals: number;
  strengths: string[];
  concerns: string[];
  nextProof: string[];
  piotroskiValidation: "confirmation" | "neutral" | "warning" | "unavailable";
  detail: string;
}''',
              'candidate funnel interface',
          )
          text = require_replace(
              text,
              '''  candidates: number;
  eligible: number;
  shadow: number;
  blocked: number;
  medianConfidence: number;''',
              '''  candidates: number;
  highConviction: number;
  qualified: number;
  watch: number;
  eligible: number;
  shadow: number;
  blocked: number;
  medianConfidence: number;''',
              'horizon summary interface',
          )
          text = require_replace(
              text,
              'buildCandidateFunnel(horizon, horizons[horizon], fundamentalModels, scoreBag.valuation)',
              'buildCandidateFunnel(horizon, horizons[horizon], fundamentalModels, scoreBag, evidence)',
              'funnel invocation',
          )

          start = text.index('function buildCandidateFunnel(')
          end = text.index('\nfunction parsePiotroskiTests', start)
          replacement = '''function buildCandidateFunnel(
  horizon: InvestmentHorizon,
  result: OpportunityHorizonScore,
  models: CandidateFundamentalModels,
  scores: ScoreBag,
  evidence: OpportunityEvidence,
): CandidateFunnel {
  const routes: DiscoveryRoute[] = [];
  const valuationScore = finite(scores.valuation?.value);
  const qualityScore = finite(scores.quality?.value);
  const trendScore = finite(scores.trend?.value);
  const momentumScore = finite(scores.momentum?.value);
  const priceDislocation = evidence.priceDislocation?.value ?? null;
  const recoveryConfirmation = evidence.recoveryConfirmation?.value ?? null;

  const conviction = assessResearchConviction({
    coreScore: result.score,
    researchPriority: result.researchPriority,
    dataConfidence: result.dataConfidence,
    evidenceCoverage: result.evidenceCoverage,
    impairmentRisk: result.impairmentRisk,
    classification: result.classification,
    priceDislocation,
    quality: qualityScore,
    valuation: valuationScore,
    trend: trendScore,
    momentum: momentumScore,
    recoveryConfirmation,
    piotroski: models.piotroski,
    magicFormula: models.magicFormula,
  });

  const classifiedPriceRoute =
    horizon === "five_to_ten"
      ? ["quality_profile", "quality_watch"].includes(result.classification)
      : ["broken_stock", "sector_washout", "recovery_watch", "durable_candidate"].includes(
          result.classification,
        );
  const numericalPriceRoute =
    horizon !== "five_to_ten" &&
    (priceDislocation ?? 0) >= 45 &&
    result.impairmentRisk < 50 &&
    (qualityScore ?? 0) >= 45;
  if (classifiedPriceRoute || numericalPriceRoute) routes.push("price_dislocation");

  if (
    models.magicFormula.state === "ranked" &&
    (models.magicFormula.universePercentile ?? 0) >= 65
  ) {
    routes.push("magic_formula");
  }

  const partialPiotroskiRatio =
    models.piotroski.state === "partial" && models.piotroski.availableTests >= 5
      ? (models.piotroski.provisionalScore ?? 0) / Math.max(1, models.piotroski.availableTests)
      : 0;
  const piotroskiStrong =
    (models.piotroski.state === "complete" && (models.piotroski.score ?? 0) >= 6) ||
    partialPiotroskiRatio >= 0.67;
  if (piotroskiStrong && (valuationScore ?? 0) >= 55) {
    routes.push("improving_value");
  }

  if (
    (qualityScore ?? 0) >= 60 &&
    (valuationScore ?? 0) >= 55 &&
    result.impairmentRisk < 50
  ) {
    routes.push("quality_value");
  }

  const uniqueRoutes = [...new Set(routes)];
  const piotroskiValidation =
    models.piotroski.state === "missing"
      ? "unavailable"
      : piotroskiStrong
        ? "confirmation"
        : models.piotroski.state === "complete" && (models.piotroski.score ?? 9) <= 3
          ? "warning"
          : "neutral";
  const routeLabels = uniqueRoutes.map((route) =>
    route === "price_dislocation"
      ? "price dislocation"
      : route === "magic_formula"
        ? "Magic Formula"
        : route === "quality_value"
          ? "quality plus value"
          : "Piotroski plus value",
  );
  const nominated =
    uniqueRoutes.length > 0 &&
    ["high_conviction", "qualified", "watch"].includes(conviction.tier);

  return {
    routes: uniqueRoutes,
    nominated,
    shadowPriority: conviction.score,
    convictionScore: conviction.score,
    researchTier: conviction.tier,
    independentSignals: conviction.independentSignals,
    strengths: conviction.strengths,
    concerns: conviction.concerns,
    nextProof: conviction.nextProof,
    piotroskiValidation,
    detail:
      uniqueRoutes.length === 0
        ? `No independent discovery route currently nominates this company. Research conviction is ${conviction.score.toFixed(1)}/100.`
        : `Nominated through ${routeLabels.join(", ")}. ${conviction.independentSignals} independent signals produce research conviction of ${conviction.score.toFixed(1)}/100.` ,
  };
}
'''
          text = text[:start] + replacement + text[end:]

          text = require_replace(
