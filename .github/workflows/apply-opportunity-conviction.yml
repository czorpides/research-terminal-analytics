        }
        return routeFilter === "all" || candidate.funnel[horizon].routes.includes(routeFilter);''',
              'tier filtering',
          )
          ui = require_replace(
              ui,
              '''        return (
          Number(rightFunnel.nominated) - Number(leftFunnel.nominated) ||
          rightFunnel.shadowPriority - leftFunnel.shadowPriority ||
          right.horizons[horizon].researchPriority - left.horizons[horizon].researchPriority
        );''',
              '''        return (
          researchTierRank(rightFunnel.researchTier) - researchTierRank(leftFunnel.researchTier) ||
          rightFunnel.convictionScore - leftFunnel.convictionScore ||
          right.horizons[horizon].researchPriority - left.horizons[horizon].researchPriority
        );''',
              'conviction sorting',
          )
          ui = require_replace(
              ui,
              '  }, [horizon, query, routeFilter, stateFilter, workspace.candidates]);',
              '  }, [horizon, query, routeFilter, stateFilter, tierFilter, workspace.candidates]);',
              'candidate memo deps',
          )
          ui = require_replace(
              ui,
              '''        <SummaryTile
          label="Research candidates"
          value={summary?.candidates ?? 0}
          detail={summary?.label ?? "1–3 years"}
          explanation="Names whose preliminary classification merits research. This count can include shadow results."
        />
        <SummaryTile
