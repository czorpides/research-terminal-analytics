name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chatgpt/stage2-calibration-review

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint (diagnostic)
        continue-on-error: true
        run: npm run lint

      # TanStack Router's file-route registry is generated by the Vite plugin.
      # Build before tsc so newly added file routes are present in routeTree.gen.ts
      # when TypeScript validates typed links and route params.
      - name: Build production application and generate route tree
        run: npm run build

      - name: Run TypeScript check against generated routes
        run: npx tsc --noEmit

      # TEMP diagnostic: capture the exact Node test failure while GitHub job-log
      # retrieval is unavailable through the connected client. Reverted after fix.
      - name: Run model tests and capture JUnit
        id: model_tests
        shell: bash
        run: |
          set +e
          node --test --test-reporter=junit --test-reporter-destination=test-results.xml src/lib/opportunity/*.test.ts src/lib/swing/*.test.ts
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload model test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-test-results
          path: test-results.xml
          if-no-files-found: error

      - name: Enforce model test result
        if: steps.model_tests.outputs.exit_code != '0'
        run: exit 1

  analytics:
    name: Python analytics tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/analytics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics/requirements.txt

      - name: Install analytics dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run analytics tests
        run: python -m pytest -q
