name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chatgpt/stage2-calibration-review

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint (diagnostic)
        continue-on-error: true
        run: npm run lint

      # TanStack Router's file-route registry is generated by the Vite plugin.
      # Build before tsc so newly added file routes are present in routeTree.gen.ts
      # when TypeScript validates typed links and route params.
      - name: Build production application and generate route tree
        run: npm run build

      - name: Run TypeScript check against generated routes
        run: npx tsc --noEmit

      - name: Run Opportunity Radar and fundamental model tests
        run: |
          set -o pipefail
          npm run test:opportunity 2>&1 | tee opportunity-test-output.txt

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-test-output
          path: opportunity-test-output.txt
          retention-days: 1

  analytics:
    name: Python analytics tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/analytics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics/requirements.txt

      - name: Install analytics dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run analytics tests
        run: python -m pytest -q
