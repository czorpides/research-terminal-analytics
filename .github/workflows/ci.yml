name: CI

on:
  pull_request:
    branches: [main, feature/catalyst-intelligence-foundation]
  push:
    branches:
      - main
      - chatgpt/stage2-calibration-review
      - feature/catalyst-source-polling

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint (diagnostic)
        continue-on-error: true
        run: npm run lint

      # TanStack Router's file-route registry is generated by the Vite plugin.
      # Build before tsc so newly added file routes are present in routeTree.gen.ts
      # when TypeScript validates typed links and route params.
      - name: Build production application and generate route tree
        run: npm run build

      - name: Run TypeScript check against generated routes
        run: npx tsc --noEmit

      - name: Verify radar research caching and retry
        run: node --experimental-strip-types --test src/lib/research/research-cache.test.ts

      - name: Test verified corporate catalysts and anti-lookahead safeguards
        run: node --experimental-strip-types --test src/lib/catalysts/company-event-model.test.ts

      - name: Test anticipatory catalyst eligibility and point-in-time safeguards
        run: node --experimental-strip-types --test src/lib/catalysts/anticipatory-model.test.ts

      - name: Test S&P official-criteria preflight (source/PIT/member veto)
        run: node --experimental-strip-types --test src/lib/catalysts/sp500-preflight.test.ts

      - name: Test official SEC filing intake without network access
        run: node --experimental-strip-types --test src/lib/catalysts/providers/sec-edgar.test.ts

      - name: Test independent catalyst review authorization
        run: node --experimental-strip-types --test src/lib/catalysts/review-auth.test.ts

      - name: Test official index announcements and source scheduler
        run: |
          node --experimental-strip-types --test src/lib/catalysts/providers/sp-index-feed.test.ts
          node --test scripts/catalyst-source-cron.test.mjs

      - name: Run Opportunity Radar and fundamental model tests
        run: npm run test:opportunity

  analytics:
    name: Python analytics tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/analytics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics/requirements.txt

      - name: Install analytics dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run analytics tests
        run: python -m pytest -q