name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chatgpt/stage2-calibration-review

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend lint, build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/radar-universe-pagination

      - name: Apply Opportunity Radar universe pagination patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/opportunity/workspace.functions.ts")
          text = path.read_text()
          start_marker = '    const { data: assetData, error: assetError } = await supabaseAdmin'
          end_marker = '    const assets = (assetData ?? []) as AssetRow[];'
          already = '    const assetPages: AssetRow[] = [];'

          if already in text:
              print("Pagination patch already applied")
              raise SystemExit(0)

          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0:
              raise SystemExit("Expected asset loader markers not found")
          end += len(end_marker)

          replacement = '''    const assetPages: AssetRow[] = [];
          const assetPageSize = 750;
          for (let offset = 0; offset < MAX_SHADOW_UNIVERSE; offset += assetPageSize) {
            const pageEnd = Math.min(offset + assetPageSize, MAX_SHADOW_UNIVERSE) - 1;
            const { data: pageData, error: pageError } = await supabaseAdmin
              .from("assets")
              .select("id,symbol,name,exchange,currency,industry_id,country_id")
              .eq("active", true)
              .eq("asset_class", "equity")
              .order("symbol", { ascending: true })
              .order("id", { ascending: true })
              .range(offset, pageEnd);
            if (pageError) throw pageError;

            const page = (pageData ?? []) as AssetRow[];
            assetPages.push(...page);
            if (page.length < assetPageSize) break;
          }

          const assets = assetPages;'''

          path.write_text(text[:start] + replacement + text[end:])
          print("Pagination patch applied")
          PY

      - name: Commit Opportunity Radar universe pagination patch
        run: |
          if git diff --quiet; then
            echo "No pagination source change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/opportunity/workspace.functions.ts
            git commit -m "Fix Opportunity Radar universe pagination"
            git push origin HEAD:fix/radar-universe-pagination
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint (diagnostic)
        continue-on-error: true
        run: npm run lint

      # TanStack Router's file-route registry is generated by the Vite plugin.
      # Build before tsc so newly added file routes are present in routeTree.gen.ts
      # when TypeScript validates typed links and route params.
      - name: Build production application and generate route tree
        run: npm run build

      - name: Run TypeScript check against generated routes
        run: npx tsc --noEmit

      - name: Run Opportunity Radar and fundamental model tests
        run: npm run test:opportunity

  analytics:
    name: Python analytics tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/analytics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics/requirements.txt

      - name: Install analytics dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run analytics tests
        run: python -m pytest -q