name: Apply discovery readiness fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/radar-discovery-readability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Calibrate readiness and remove diagnostics
        shell: python
        run: |
          from pathlib import Path

          model = Path('src/lib/opportunity/discovery-routes.ts')
          text = model.read_text()
          anchor = '  const readiness: DiscoveryReadiness = bestRoute?.qualifies && coverage >= 34'
          replacement = (
              '  const hasInstitutionalValidation = Boolean(institutional && institutional.coverage >= 30);\n'
              '  const readiness: DiscoveryReadiness = bestRoute?.qualifies && hasInstitutionalValidation'
          )
          if anchor not in text:
              raise SystemExit('Expected discovery readiness anchor not found')
          text = text.replace(anchor, replacement, 1)
          old_branch = '    : bestRoute?.emerging\n'
          new_branch = '    : bestRoute?.qualifies || bestRoute?.emerging\n'
          if old_branch not in text:
              raise SystemExit('Expected emerging branch not found')
          text = text.replace(old_branch, new_branch, 1)
          model.write_text(text)

          for path in [
              Path('.github/workflows/opportunity-test-diagnostics.yml'),
              Path('.github/workflows/apply-discovery-readiness-fix.yml'),
          ]:
              if path.exists():
                  path.unlink()
      - name: Commit calibrated readiness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/opportunity/discovery-routes.ts .github/workflows
          git commit -m "Keep incomplete discovery routes emerging"
          git push origin HEAD:${{ github.head_ref }}
