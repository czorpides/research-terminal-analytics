name: Apply discovery readiness fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/radar-discovery-readability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Calibrate readiness and remove diagnostics
        shell: python
        run: |
          from pathlib import Path

          model = Path('src/lib/opportunity/discovery-routes.ts')
          text = model.read_text()
          old = '''  const coverage = institutional?.coverage ?? conviction.coverage;
          const readiness: DiscoveryReadiness = bestRoute?.qualifies && coverage >= 34
            ? "ready"
            : bestRoute?.emerging
              ? "emerging"
              : coverage < 30
                ? "coverage_gap"
                : "not_nominated";'''
          new = '''  const coverage = institutional?.coverage ?? conviction.coverage;
          const hasInstitutionalValidation = Boolean(institutional && institutional.coverage >= 30);
          const readiness: DiscoveryReadiness = bestRoute?.qualifies && hasInstitutionalValidation
            ? "ready"
            : bestRoute?.qualifies || bestRoute?.emerging
              ? "emerging"
              : coverage < 30
                ? "coverage_gap"
                : "not_nominated";'''
          if old not in text:
              raise SystemExit('Expected discovery readiness block not found')
          model.write_text(text.replace(old, new, 1))

          for path in [
              Path('.github/workflows/opportunity-test-diagnostics.yml'),
              Path('.github/workflows/apply-discovery-readiness-fix.yml'),
          ]:
              if path.exists():
                  path.unlink()
      - name: Commit calibrated readiness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/opportunity/discovery-routes.ts .github/workflows
          git commit -m "Keep incomplete discovery routes emerging"
          git push origin HEAD:${{ github.head_ref }}
