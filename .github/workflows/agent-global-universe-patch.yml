name: One-shot global universe patch

on:
  push:
    branches:
      - agent/global-universe-and-research-surfaces

permissions:
  contents: write

jobs:
  patch-radar-cap:
    if: ${{ !contains(github.event.head_commit.message, '[global-universe-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-universe-and-research-surfaces
          fetch-depth: 0
      - name: Lift Opportunity Radar cap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/opportunity/workspace.functions.ts')
          text = path.read_text()
          old = 'const MAX_SHADOW_UNIVERSE = 500;'
          new = 'const MAX_SHADOW_UNIVERSE = 3_000;'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected Opportunity Radar universe constant was not found')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/opportunity/workspace.functions.ts
          git commit -m "Lift Opportunity Radar cap to 3000 [global-universe-patch]"
          git push origin HEAD:agent/global-universe-and-research-surfaces
